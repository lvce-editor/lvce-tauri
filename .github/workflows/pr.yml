name: PR
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb webkit2gtk-driver
      - run: npm ci
      - run: npm run prepare:lvce
      - run: npm run build:runtime
      - run: npm test
      - name: Test native lifecycle
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Tauri package
        run: npm run build -- --bundles ${{ matrix.bundles }}
      - name: Install native WebDriver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --locked
      - name: Install matching Edge driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Item 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe').VersionInfo.ProductVersion
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile driver.zip
          Expand-Archive driver.zip -DestinationPath edgedriver
          "$pwd\edgedriver" >> $env:GITHUB_PATH
      - name: Test packaged Linux editor
        if: runner.os == 'Linux'
        run: |
          dpkg-deb -x src-tauri/target/release/bundle/deb/*.deb test-package
          TAURI_TEST_BINARY="$PWD/test-package/usr/bin/lvce-tauri" xvfb-run -a npm run test:e2e
      - name: Test packaged Windows editor
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe).FullName
          $destination = "$pwd\test-package"
          Start-Process -FilePath $installer -ArgumentList '/S', "/D=$destination" -Wait
          $env:TAURI_TEST_BINARY = "$destination\lvce-tauri.exe"
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/
            test-results/
            src-tauri/Cargo.lock
          if-no-files-found: error
